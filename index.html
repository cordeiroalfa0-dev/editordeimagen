
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VisionOS">
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=V&background=800020&color=fff&size=192">
    <link rel="manifest" href="manifest.json">
    <title>VisionOS - Ultra Fast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #e11d48;
            --bg-deep: #0a0a0b;
            --glass: rgba(15, 15, 18, 0.9);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * {
            -webkit-tap-highlight-color: transparent;
            outline: none !important;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-deep);
            color: #ffffff;
            margin: 0;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 0%, rgba(225, 29, 72, 0.08), transparent 50%);
            -webkit-font-smoothing: antialiased;
        }

        /* PERFORMANCE: Reduzindo blur no mobile */
        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(12px); /* Reduzido de 50px para 12px para performance */
            border: 1px solid var(--glass-border);
        }

        @media (max-width: 768px) {
            .glass-panel {
                backdrop-filter: none; /* Desativa blur em mobile para economizar bateria/CPU */
                background: rgba(20, 20, 22, 0.98);
            }
        }

        .text-wine-glow {
            background: linear-gradient(to bottom, #fb7185, #e11d48);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .label-wine {
            color: #fb7185;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-weight: 800;
            font-size: 0.7rem;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        /* Animações Ultra Rápidas */
        .fast-fade { animation: fadeIn 0.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .neo-button { transition: transform 0.1s ease, box-shadow 0.1s ease; }
        .neo-button:active { transform: scale(0.96); }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body class="antialiased">
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
